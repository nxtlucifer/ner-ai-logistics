# Deployment descriptor for the hosted intelligence plane.
#
# Render is used here because it deploys a Dockerfile from a repository with no
# CLI and no local credentials - the whole blocker at the time this was written.
# Nothing in the application is Render-specific: the same image runs on Fly,
# Railway, Cloud Run or any host that sets $PORT.
#
# TO DEPLOY
#
#   1. Push this repository to GitHub.
#   2. Render -> New -> Blueprint -> this repo (the file must sit at the repo root).
#   3. Fill DATABASE_URL (the Supabase session-pooler string) in the dashboard.
#      It is the ONE secret; SECRET_KEY is generated by Render.
#   4. The manager web is the second service below (static site, same
#      blueprint); the driver APK is `eas build -p android --profile
#      remote-demo` (driver-app/eas.json). Both point at the API service URL
#      below - if Render suffixes the service name, update the two URLs here
#      and in eas.json and push again.
#
# WHAT THIS SERVICE IS NOT
#
# It is not the system of record. Supabase remains authoritative for auth,
# trips, fleet, assignments, GPS and authorization. This service reads that
# database to answer questions about routes and returns evidence-backed
# assessments. If it is down, the clients report accessibility as UNASSESSED and
# every other workflow keeps working - which is the property that makes hosting
# it a smaller risk than embedding it.

services:
  - type: web
    name: ner-intelligence
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore # Closest offered region to the North East.
    # `/health` is the LIVENESS probe and carries no prefix - the system router
    # is mounted at the root while the application routers are under /api.
    # Deliberately not `/ready`: that one opens a database connection, so a
    # brief Supabase hiccup would make the platform kill and restart a process
    # that was fine.
    healthCheckPath: /health
    # Redeploy the API only when the API changes. Without this filter every
    # push - a manager-only fix, a docs handoff - restarted the backend, and
    # for those minutes hosted requests timed out or closed mid-body.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production

      # ONE TRANSPORT (12 Sep): the manager web and the driver APK talk to this
      # service alone - its own /api/auth/login, its own JWT - exactly as the
      # local demo does, so nothing that was verified locally changes shape
      # remotely. Supabase stays the managed Postgres behind DATABASE_URL.
      # (The earlier split, AUTH_PROVIDER=supabase + Supabase transport in the
      # clients, is still supported by the code but the Supabase client
      # transport lacks routeRisk/requestReroute; do not ship the demo on it.)
      - key: AUTH_PROVIDER
        value: local
      - key: SUPABASE_URL
        value: https://znaveeefzgfxsblsobdb.supabase.co

      - key: DATABASE_PROVIDER
        value: supabase

      # SEC-006. Render terminates TLS and adds exactly ONE hop, so the
      # rate limiter reads the last entry of X-Forwarded-For as the client.
      # Without this the limiter keys on Render's proxy and one per-address
      # budget is shared by every caller on the internet.
      #
      # Do not raise this number. Each extra hop is one more position of a
      # client-controlled header that becomes trusted, and at two hops on a
      # one-hop deployment an attacker chooses their own rate-limit key.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Sized for Supabase's session pooler, which allows 15 clients per
      # project across every connected service. A larger pool here starves the
      # rest of the project rather than making this one faster.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_REQUIRE_SSL
        value: "true"

      # The manager web origin, comma-separated. The driver APK is native and
      # is not subject to CORS, so it does not belong here.
      - key: CORS_ORIGINS
        value: https://ner-manager.onrender.com,https://ner-driver-web.onrender.com
      # The manager is on another *.onrender.com site: a strict refresh
      # cookie would never come back. See app/core/config.py.
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      # Free data sources this service reads (no keys). Off = factor NOT_AVAILABLE.
      - key: WEATHER_ENABLED
        value: "true"
      - key: TERRAIN_ENABLED
        value: "true"
      - key: FLOOD_ENABLED
        value: "true"
      - key: WARNINGS_ENABLED
        value: "true"
      - key: WARNINGS_POLL_ENABLED
        value: "true"
      - key: ROUTE_WATCH_ENABLED
        value: "true"
      - key: BREAK_WATCH_ENABLED
        value: "true"
      - key: DEMO_SIMULATION_ENABLED
        value: "true"
      # One instance. Before scaling out set this true (it forces the demo
      # simulation off); see app/services/coordination.py.
      # Connection budget once it is true: (DB_POOL_SIZE + DB_MAX_OVERFLOW + 1
      # coordination connection) x instances must stay <= the pooler's 15
      # clients (see DB_POOL_SIZE above), counting old and new instances side
      # by side during a deploy and anything else on the project. At 3+2+1 =
      # 6 each, two instances (12) fit but not their deploy overlap (24):
      # lower DB_MAX_OVERFLOW / DB_POOL_SIZE first (e.g. 2+0+1 = 3 each).
      - key: MULTI_INSTANCE
        value: "false"

      # Secrets. Never in this file - it is committed.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Online assistant providers (set in the dashboard; the app works without either).
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # The manager web, built here against the API service above. ONE transport:
  # the same REST client the local demo and every test use (VITE_BACKEND=local).
  - type: web
    name: ner-manager
    runtime: static
    rootDir: manager-web
    buildCommand: npm ci && npx vite build --mode remote-demo
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND
        value: local
      - key: VITE_API_BASE_URL
        value: https://ner-intelligence.onrender.com
      - key: VITE_DRIVER_WEB_URL
        value: https://ner-driver-web.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The manager release header set (manager-web/vercel.json and netlify.toml
    # carry the same, with their own backend origin in connect-src).
    #
    # HSTS is not set here: Render's static host already sends
    # "max-age=315360000; includeSubdomains; preload" and serves HTTPS only
    # (docs/submission/day2/task2/evidence/headers_before_after.txt). A second
    # HSTS header would be ignored (browsers take the first).
    #
    # CSP rollout: the full policy ships REPORT-ONLY first (violations appear in
    # the browser console; no report-uri on purpose). The enforced header keeps
    # frame-ancestors, which report-only cannot carry. To enforce: rename the
    # report-only header to Content-Security-Policy and delete the short one.
    # The three sha256 values are pinned by manager-web/src/cspHashes.test.ts:
    # when that test fails, update the policy here, in vercel.json and in
    # netlify.toml in the same change. connect-src is VITE_API_BASE_URL below.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'sha256-1ze4e7nqjWdu4+OP5sDxplZhiBs3zQSpHtH4voUP/8k=' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' https://fonts.googleapis.com 'sha256-R/y7pZVjL46qC0l0q1ZlqCUve89HwF5U0JLLHqdSMI8='; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://s3.amazonaws.com; connect-src 'self' https://ner-intelligence.onrender.com https://tile.openstreetmap.org https://s3.amazonaws.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), payment=(), geolocation=()
      # Vite names every built asset by its content hash: a new build is a new
      # file name, so a cached copy can never be stale. index.html (which names
      # them) keeps Render's default and is revalidated on every load.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # The driver app's web build: what "View as driver" opens (read-only support
  # token in the URL fragment) and a judge's fallback when no phone is at hand.
  - type: web
    name: ner-driver-web
    runtime: static
    rootDir: driver-app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://ner-intelligence.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(self), payment=()
      # Expo's web export content-hashes its bundles the same way.
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
